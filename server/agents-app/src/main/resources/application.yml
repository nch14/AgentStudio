server:
  port: 8685
spring:
  application:
    name: agents-app
  datasource:
    url: jdbc:sqlite:${user.home}/agent-workspace/data/agents.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jackson:
    time-zone: ${SERVER_TIMEZONE:UTC}
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: ${SERVER_TIMEZONE:UTC}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  web:
    resources:
      static-locations: classpath:/static/,file:/app/static/frontend/
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    port: 465
    protocol: smtps
    properties.mail.smtp:
      auth: true
      starttls.enable: true
      starttls.required: true

  ai:
    mcp:
      server:
        enabled: true
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

oss:
  url: ${OSS_URL:http://localhost:9000}
  public-url: ${OSS_PUBLIC_URL:${oss.url}}
  username: ${OSS_USERNAME:dev}
  password: ${OSS_PASSWORD:dev}
  region: ${OSS_REGION:us-east-1}
  bucket: ${OSS_BUCKET:agents}
  presign-expire-minutes: 10

app:
  mail:
    sender-name: ${MAIL_SENDER_NAME:}
  bark:
    server-url: ${BARK_SERVER_URL:}
  notify:
    scheduler:
      enabled: true
      fixed-rate: 60000
    config-code:
      questions-raised: questions_raised
      turn-waiting: questions_raised
      turn-hanging: turn_hanging
      task-succeeded: task_succeeded

agents:
  workspace-path: ${user.home}/agent-workspace
  scheduler:
    backup:
      enabled: false
      cron: "0 0 * * * *"
    task:
      enabled: true
      start-time: "00:00"
      end-time: "23:59"
      fixed-rate: 300000
      hanging-timeout-seconds: 1800
    turn:
      enabled: true
      start-time: "00:00"
      end-time: "23:59"
      fixed-rate: 300000
    plan:
      enabled: true
      fixed-rate: 60000
  claude-code:
    cli-path: claude
    mcp-server-url: http://localhost:8685/sse
    permission-mode: bypassPermissions
  auth:
    initial-token: ${AGENTS_AUTH_INITIAL_TOKEN:}
    allow-http-init: ${AGENTS_AUTH_ALLOW_HTTP_INIT:true}
